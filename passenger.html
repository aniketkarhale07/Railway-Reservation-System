<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Passenger | RailWayGo</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<style>

@keyframes slideUp {

from {
opacity:0;
transform:translateY(40px);
}

to {
opacity:1;
transform:translateY(0);
}

}

.passenger-box {
animation:slideUp .8s ease;
}

</style>

</head>


<body class="bg-slate-950 text-white">


<nav class="fixed top-0 w-full z-50 bg-slate-950/90 backdrop-blur-xl border-b border-white/10">

<div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

<a href="index.html" class="text-2xl font-black">
🚆 <span class="text-red-500">RailWay</span>Go
</a>

<div class="hidden md:flex gap-8 font-semibold">

<a href="index.html" class="hover:text-red-400">
Home
</a>

<a href="booking.html" class="hover:text-red-400">
Booking
</a>

<a href="train.html" class="hover:text-red-400">
Trains
</a>

<a href="passenger.html" class="text-red-400">
Passenger
</a>

<a href="about.html" class="hover:text-red-400">
About
</a>

</div>

</div>

</nav>


<section class="pt-32 pb-20 min-h-screen">

<div class="max-w-4xl mx-auto px-6 passenger-box">

<div class="text-center mb-10">

<p class="text-red-500 font-bold">
PASSENGER DETAILS
</p>

<h1 class="text-5xl font-black">
Passenger Information
</h1>

</div>


<div class="bg-slate-900 border border-white/10 rounded-3xl p-8 md:p-10">

<form class="grid md:grid-cols-2 gap-6">


<div>

<label class="block mb-2">
Full Name
</label>

<input
type="text"
placeholder="Enter passenger name"
class="w-full bg-slate-800 rounded-xl px-5 py-4 outline-none focus:ring-2 ring-red-500">

</div>


<div>

<label class="block mb-2">
Age
</label>

<input
type="number"
placeholder="Enter age"
class="w-full bg-slate-800 rounded-xl px-5 py-4 outline-none focus:ring-2 ring-red-500">

</div>


<div>

<label class="block mb-2">
Gender
</label>

<select class="w-full bg-slate-800 rounded-xl px-5 py-4">

<option>Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>

</select>

</div>


<div>

<label class="block mb-2">
Phone Number
</label>

<input
type="tel"
placeholder="+91 XXXXX XXXXX"
class="w-full bg-slate-800 rounded-xl px-5 py-4 outline-none focus:ring-2 ring-red-500">

</div>


<div class="md:col-span-2">

<label class="block mb-2">
Email Address
</label>

<input
type="email"
placeholder="example@gmail.com"
class="w-full bg-slate-800 rounded-xl px-5 py-4 outline-none focus:ring-2 ring-red-500">

</div>


<div class="md:col-span-2">

<label class="block mb-2">
Address
</label>

<textarea
rows="4"
placeholder="Enter your address"
class="w-full bg-slate-800 rounded-xl px-5 py-4 outline-none focus:ring-2 ring-red-500"></textarea>

</div>


<div class="md:col-span-2">

<button
type="button"
onclick="alert('Passenger details saved successfully!')"
class="w-full bg-red-600 hover:bg-red-700 py-4 rounded-xl font-black text-lg transition">

✓ Save Passenger Details

</button>

</div>

</form>

</div>

</div>

</section>


<footer class="border-t border-white/10 py-8 text-center text-slate-500">

© 2026 RailWayGo • Railway Reservation System

</footer>

</body>
</html>
