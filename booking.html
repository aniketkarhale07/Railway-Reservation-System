<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Ticket | RailWayGo</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<style>

html {
    scroll-behavior:smooth;
}

@keyframes slide {
    from {
        opacity:0;
        transform:translateY(30px);
    }

    to {
        opacity:1;
        transform:translateY(0);
    }
}

.animate-page {
    animation:slide .8s ease;
}

</style>

</head>

<body class="bg-slate-950 text-white">


<!-- NAVBAR -->

<nav class="fixed top-0 w-full z-50 bg-slate-950/90 backdrop-blur-xl border-b border-white/10">

<div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

<a href="index.html" class="text-2xl font-black">
🚆 <span class="text-red-500">RailWay</span>Go
</a>

<div class="hidden md:flex gap-8 font-semibold">

<a href="index.html" class="hover:text-red-400">Home</a>

<a href="booking.html" class="text-red-400">Booking</a>

<a href="train.html" class="hover:text-red-400">Trains</a>

<a href="passenger.html" class="hover:text-red-400">Passenger</a>

<a href="about.html" class="hover:text-red-400">About</a>

</div>

</div>
</nav>


<section class="pt-32 pb-20 min-h-screen">

<div class="max-w-5xl mx-auto px-6 animate-page">

<div class="text-center mb-12">

<p class="text-red-500 font-bold">
TICKET RESERVATION
</p>

<h1 class="text-5xl font-black mt-2">
Book Your Journey
</h1>

<p class="text-slate-400 mt-4">
Enter your journey details below.
</p>

</div>


<div class="bg-slate-900 border border-white/10 rounded-3xl p-7 md:p-10 shadow-2xl">

<form class="grid md:grid-cols-2 gap-6">


<div>

<label class="block mb-2 text-slate-300">
From
</label>

<select class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-4 outline-none focus:border-red-500">

<option>Select Source</option>

<option>Mumbai</option>
<option>Pune</option>
<option>Delhi</option>
<option>Nashik</option>
<option>Ahmednagar</option>

</select>

</div>


<div>

<label class="block mb-2 text-slate-300">
To
</label>

<select class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-4 outline-none focus:border-red-500">

<option>Select Destination</option>

<option>Delhi</option>
<option>Mumbai</option>
<option>Pune</option>
<option>Hyderabad</option>
<option>Bangalore</option>

</select>

</div>


<div>

<label class="block mb-2 text-slate-300">
Journey Date
</label>

<input type="date"
class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-4 outline-none focus:border-red-500">

</div>


<div>

<label class="block mb-2 text-slate-300">
Class
</label>

<select class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-4">

<option>AC First Class</option>
<option>AC 2 Tier</option>
<option>AC 3 Tier</option>
<option>Sleeper</option>
<option>Second Sitting</option>

</select>

</div>


<div>

<label class="block mb-2 text-slate-300">
Passengers
</label>

<select class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-4">

<option>1 Passenger</option>
<option>2 Passengers</option>
<option>3 Passengers</option>
<option>4 Passengers</option>
<option>5 Passengers</option>

</select>

</div>


<div>

<label class="block mb-2 text-slate-300">
Train Type
</label>

<select class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-4">

<option>Any Train</option>
<option>Superfast</option>
<option>Express</option>
<option>Special</option>

</select>

</div>


<div class="md:col-span-2">

<button type="button"
onclick="alert('Demo booking form submitted!')"
class="w-full bg-red-600 hover:bg-red-700 hover:scale-[1.01] transition py-4 rounded-xl font-black text-lg">

🎫 Search & Book Ticket

</button>

</div>

</form>

</div>

</div>

</section>


<footer class="border-t border-white/10 py-8 text-center text-slate-500">

© 2026 RailWayGo • Railway Reservation System

</footer>

</body>
  </html>
